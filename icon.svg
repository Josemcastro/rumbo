<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Rumbo">
  <!-- Fondo negro; dibujo en blanco y todo dentro del 80 % central -->
  <rect width="512" height="512" rx="112" fill="#000000"/>
  <!-- Diana central: dos anillos y el centro -->
  <g fill="none" stroke="#ffffff" stroke-width="17">
    <circle cx="256" cy="256" r="91"/>
    <circle cx="256" cy="256" r="54"/>
  </g>
  <circle cx="256" cy="256" r="22" fill="#ffffff"/>
  <!-- Órbita fina que une los objetivos; se interrumpe alrededor de cada icono -->
  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round">
    <path d="M302.39 94.53A168 168 0 0 1 337.37 109.02"/>
    <path d="M402.98 174.63A168 168 0 0 1 417.47 209.61"/>
    <path d="M417.47 302.39A168 168 0 0 1 402.98 337.37"/>
    <path d="M337.37 402.98A168 168 0 0 1 302.39 417.47"/>
    <path d="M209.61 417.47A168 168 0 0 1 174.63 402.98"/>
    <path d="M109.02 337.37A168 168 0 0 1 94.53 302.39"/>
    <path d="M94.53 209.61A168 168 0 0 1 109.02 174.63"/>
    <path d="M174.63 109.02A168 168 0 0 1 209.61 94.53"/>
  </g>
  <!-- Anillo de objetivos: iconos lineales de 24 × 24 escalados ×3 (trazo final de 7,5 px) -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Casa (vivienda) -->
    <g transform="translate(220 52) scale(3)">
      <path d="M3 11.5L12 3.5l9 8"/>
      <path d="M5.5 9.5v11h13v-11"/>
      <path d="M10 20.5V15h4v5.5"/>
    </g>
    <!-- Avión (viajes), dibujado de frente y girado 45° -->
    <g transform="translate(338.79 101.21) scale(3)">
      <path transform="rotate(45 12 12)" d="M9.8 9.6V5.2a2.2 2.2 0 0 1 4.4 0v4.4l6.8 3.6v2.6l-6.8-1.6v3.4l2.2 1.6v2.1L12 19.9l-4.4 1.4v-2.1l2.2-1.6v-3.4L3 15.8v-2.6z"/>
    </g>
    <!-- Hucha (ahorro) -->
    <g transform="translate(388 220) scale(3)">
      <path d="M18.6 10h1.9a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-1.7c-.6 1.6-1.8 2.8-2.8 3.4V20h-2.5v-1.7c-1.1.2-2.9.2-4 0V20H7v-2.8C5.2 16 4 14.2 4 12.3 4 8.5 7.5 5.8 11.5 5.8c1.4 0 2.7.3 3.9.8l2.4-1.8.3 3.4c.2.5.4 1.1.5 1.8z"/>
      <path d="M15.2 10.2h.01"/>
    </g>
    <!-- Anillo (boda) -->
    <g transform="translate(338.79 338.79) scale(3)">
      <circle cx="12" cy="14.5" r="6.3"/>
      <path d="M9.5 5.4L11 3.4h2l1.5 2L12 8.2z"/>
    </g>
    <!-- Moto (movilidad) -->
    <g transform="translate(220 388) scale(3)">
      <circle cx="5" cy="15" r="3.3"/>
      <circle cx="19" cy="15" r="3.3"/>
      <path d="M3 8.5h6.2l1.6-1.5h5.1"/>
      <path d="M9.2 8.5l1.5 3.8h2.7l1.7-2.6"/>
      <path d="M17.8 11.9L15.2 5h-2"/>
    </g>
    <!-- Documento (trámites) -->
    <g transform="translate(101.21 338.79) scale(3)">
      <path d="M14 2.5H7a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-12z"/>
      <path d="M14 2.5v5h5"/>
      <path d="M8.5 12.5h7"/>
      <path d="M8.5 16.5h5"/>
    </g>
    <!-- Paraguas (imprevistos) -->
    <g transform="translate(52 220) scale(3)">
      <path d="M2.5 13a9.5 9.5 0 0 1 19 0q-3.17-1.9-6.33 0-3.17-1.9-6.33 0-3.17-1.9-6.34 0z"/>
      <path d="M12 12.1v6.9a2 2 0 0 1-4 0"/>
      <path d="M12 3.5V2.3"/>
    </g>
    <!-- Birrete (estudios) -->
    <g transform="translate(101.21 101.21) scale(3)">
      <path d="M12 5l10 4.5-10 4.5L2 9.5z"/>
      <path d="M6.5 11.5V16c0 1.7 2.5 3 5.5 3s5.5-1.3 5.5-3v-4.5"/>
      <path d="M22 9.5v5"/>
