<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data:; style-src 'self'; font-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">

  <link rel="icon" href="icon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="styles.css">

<body>
  <div id="app" class="app">
    <div class="screen screen-loading" role="status">
      <div class="spinner" aria-hidden="true"></div>

  </div>

    <div class="screen"><div class="screen-card">

    </div></div>
